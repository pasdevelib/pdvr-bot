name: forecast-cities

# Migré depuis pasdevelib/pdv-bot le 2026-09-28 (voir README.md).
# Prévision 7 jours pour les villes en région, même moteur predict.py
# que Paris. Matrice + fail-fast: false = isolation par ville.
#
# Écrit sa sortie (cities-aggregates) dans CE dépôt (pdvr-bot) — token
# par défaut. Lit malgré tout deux fichiers partagés avec Paris
# (calendar.parquet, weather.parquet) directement depuis pdv-bot, en
# anonyme (repo public, cf. forecast_cities.py / PARIS_REPO) : aucun
# secret supplémentaire n'est nécessaire pour ça non plus.
on:
  schedule:
    # 05:45 UTC, après consolidate-cities.yml (03:30)
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    name: Forecast ${{ matrix.city }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        city: [bordeaux, lyon, toulouse, lille, rennes, strasbourg, nantes, montpellier]
    steps:
      - name: Install
        run: pip install requests pandas pyarrow "git+https://github.com/pasdevelib/pdv-bot.git"

      - name: Forecast ${{ matrix.city }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pasdevelib.forecast_cities --cities ${{ matrix.city }}
