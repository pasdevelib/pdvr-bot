name: stats-cities

# Migré depuis pasdevelib/pdv-bot le 2026-09-28 (voir README.md).
# Classements quotidiens des stations (vides/pleines/fiables), par ville
# en région, sur 3 fenêtres (jour/semaine/mois). Alimente
# blog.pasdevelib.app/donnees.
on:
  schedule:
    # 06:00 UTC, après consolidate-cities.yml (03:30) et forecast-cities.yml (05:45)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  stats:
    name: Stats toutes villes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install
        run: pip install requests pandas pyarrow "git+https://github.com/pasdevelib/pdv-bot.git"

      - name: Compute stats
        env:
          GH_TOKEN: ${{ secrets.PDV_BOT_TOKEN }}
          GITHUB_REPOSITORY: pasdevelib/pdv-bot
        run: python -m pasdevelib.stats_cities
